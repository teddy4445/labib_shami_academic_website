  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font:1.1rem/1.6 "Iowan Old Style", Palatino, Georgia, serif; padding:1.5rem; }

  p { color:var(--ink-2); font-family:system-ui, "Segoe UI", sans-serif; }
  a { color:var(--navy); font-family:system-ui, "Segoe UI", sans-serif; font-weight:600; }
  ul { padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:.5rem 1.25rem; border-top:1px solid var(--rule); padding-top:1rem; }

</style>

</main>
<script>
  // GitHub Pages serves this page for any missing path, at any depth. Point the links at the
  // site root: the first path segment on *.github.io project sites, otherwise the domain root.
  (function () {
    var seg = location.pathname.split('/').filter(Boolean);
    var base = /\.github\.io$/.test(location.hostname) && seg.length ? '/' + seg[0] + '/' : '/';
    var links = document.querySelectorAll('#links a');
    for (var i = 0; i < links.length; i++) links[i].href = base + links[i].getAttribute('data-path');
  })();
</script>
